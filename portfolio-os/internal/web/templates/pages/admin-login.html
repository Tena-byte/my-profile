{{ define "admin-login" }}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link rel="stylesheet" href="/static/css/admin.css">
</head>

<body>

    <main class="admin-login">
        <form method="POST" action="/admin/login">

            <h1>Admin Login</h1>

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                required
                autocomplete="current-password"
            >

            <button type="submit">
                Login
            </button>

        </form>
    </main>

</body>
</html>

{{ end }}
