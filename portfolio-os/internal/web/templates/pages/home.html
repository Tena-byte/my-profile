{{ define "content" }}
<link rel="stylesheet" href="/static/css/client.css">
<link rel="stylesheet" href="/static/css/developer.css">
<div class="view-controls">
    <button
        type="button"
        id="view-toggle"
        aria-label="Switch between Client View and Developer View"
        aria-pressed="false"
    >
        <span id="view-label">Developer View</span>
    </button>
</div>

{{ template "client-view" . }}

{{ template "developer-view" . }}

<script src="/static/js/view-toggle.js"></script>
<script src="/static/js/analytics.js"></script>

{{ end }}
